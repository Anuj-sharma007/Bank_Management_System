<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Customer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-success">

        <div class="container">

            <span class="navbar-brand">
                🏦 Update Customer Details
            </span>

            <a href="{% if session.get('role') == 'admin' %}
                        {{ url_for('admin_dashboard') }}
                    {% else %}
                        {{ url_for('employee_dashboard') }}
                    {% endif %}"
                class="btn btn-secondary">
                    Back
            </a>

        </div>

    </nav>


    <!-- Flash Messages -->
    <div class="container mt-3">

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="alert alert-{{ category }} alert-dismissible fade show"
                         role="alert">

                        {{ message }}

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert">
                        </button>

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}

    </div>


    <div class="container mt-4">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="mb-4">
                            Update Customer Information
                        </h2>

                        <form method="POST">

                            <div class="mb-3">

                                <label class="form-label">
                                    Customer ID
                                </label>

                                <input type="number"
                                       name="customerid"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Select Information to Update
                                </label>

                                <select name="field"
                                        class="form-select"
                                        required>

                                    <option value="">
                                        Select Field
                                    </option>

                                    <option value="name">
                                        Name
                                    </option>

                                    <option value="dob">
                                        Date of Birth
                                    </option>

                                    <option value="phone">
                                        Phone
                                    </option>

                                    <option value="email">
                                        Email
                                    </option>

                                </select>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    New Value
                                </label>

                                <input type="text"
                                       name="value"
                                       class="form-control"
                                       required>

                            </div>


                            <button type="submit"
                                    class="btn btn-success">

                                Update Customer

                            </button>

                            <a href="{% if session.get('role') == 'admin' %}
                                        {{ url_for('admin_dashboard') }}
                                    {% else %}
                                        {{ url_for('employee_dashboard') }}
                                    {% endif %}"
                                class="btn btn-secondary">
                                    Cancel
                            </a>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
