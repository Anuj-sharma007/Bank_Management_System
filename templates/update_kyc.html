<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update KYC</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-success">

        <div class="container">

            <span class="navbar-brand">
                🏦 Update KYC
            </span>

            <a href="{% if session.get('role') == 'admin' %}
                        {{ url_for('admin_dashboard') }}
                    {% else %}
                        {{ url_for('employee_dashboard') }}
                    {% endif %}"
                class="btn btn-secondary">
                    Back
            </a>

        </div>

    </nav>


    <!-- Flash Messages -->
    <div class="container mt-3">

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="alert alert-{{ category }} alert-dismissible fade show"
                         role="alert">

                        {{ message }}

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert">
                        </button>

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}

    </div>


    <!-- Form -->
    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h3 class="mb-3">
                            Update Customer KYC
                        </h3>

                        <p class="text-muted">
                            Enter the Customer ID and select the account type.
                        </p>


                        <form method="POST">

                            <!-- Customer ID -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Customer ID
                                </label>

                                <input type="number"
                                       name="customerid"
                                       class="form-control"
                                       required>

                            </div>


                            <!-- Account Type -->
                            <div class="mb-3">

                                <label class="form-label">
                                    Account Type
                                </label>

                                <select name="account_type"
                                        class="form-select"
                                        required>

                                    <option value="">
                                        Select Account Type
                                    </option>

                                    <option value="savings">
                                        Savings
                                    </option>

                                    <option value="current">
                                        Current
                                    </option>

                                </select>

                            </div>


                            <!-- Buttons -->
                            <button type="submit"
                                    class="btn btn-success">

                                Update KYC

                            </button>

                            <a href="{% if session.get('role') == 'admin' %}
                                        {{ url_for('admin_dashboard') }}
                                    {% else %}
                                        {{ url_for('employee_dashboard') }}
                                    {% endif %}"
                                class="btn btn-secondary">
                                    Cancel
                            </a>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
