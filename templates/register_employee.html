<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="d-flex justify-content-end">
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Back</a>
</div>

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="mb-4">
                            Register New Employee
                        </h2>

                        <form method="POST">

                            <div class="mb-3">

                                <label class="form-label">
                                    Employee Name
                                </label>

                                <input type="text"
                                       name="name"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Date of Birth
                                </label>

                                <input type="date"
                                       name="dob"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Phone Number
                                </label>

                                <input type="text"
                                       name="phone"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input type="email"
                                       name="email"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Salary
                                </label>

                                <input type="number"
                                       name="salary"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Branch ID
                                </label>

                                <input type="number"
                                       name="branchid"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Username
                                </label>

                                <input type="text"
                                       name="username"
                                       class="form-control"
                                       required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Password
                                </label>

                                <input type="password"
                                       name="password"
                                       class="form-control"
                                       required>

                                <div class="form-text">
                                    Must contain at least 8 characters,
                                    one uppercase letter, one digit,
                                    and one special character.
                                </div>

                            </div>


                            <button type="submit"
                                    class="btn btn-primary">

                                Register Employee

                            </button>

                            <a href="{{ url_for('admin_dashboard') }}"
                               class="btn btn-secondary">

                                Back

                            </a>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
